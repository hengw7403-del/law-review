<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>登录 · 合同辅助初审</title><link rel="stylesheet" href="/style.css"><script src="/api.js" defer></script><script src="/nav.js" defer></script><script src="/login.js" defer></script></head>
<body><nav id="nav" aria-label="主导航"></nav><main class="login-main"><section class="panel"><h1>登录工作台</h1><p class="muted">管理合同，查看初审进度。</p>
<form id="login-form"><div class="field"><label for="username">用户名</label><input id="username" name="username" autocomplete="username" required maxlength="80" autofocus></div>
<div class="field"><label for="password">密码</label><input id="password" name="password" type="password" autocomplete="current-password" required maxlength="1024"></div>
<p id="login-error" class="notice error" role="alert" hidden></p><button id="login-submit" class="primary" type="submit">登录</button></form></section>
<p class="muted small">登录状态仅保存在当前浏览器会话中。</p><noscript>请启用 JavaScript 后登录。</noscript></main></body></html>
